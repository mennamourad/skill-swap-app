<main class="flex-1 px-10 py-7 flex flex-col justify-between">
<div>
<!-- Top Back Navigation Header -->
<div class="flex items-center gap-3.5 mb-7">
<button aria-label="Go back" class="text-[#0F172A] hover:text-[#334155] transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-[20px] font-bold text-[#0F172A]">Report User</h1>
</div>
<!-- Section Title and Description -->
<div class="mb-6">
<h2 class="text-[17px] font-bold text-[#1E293B] mb-1.5">Report Alaa Ahmed</h2>
<p class="text-[13.5px] text-[#64748B]">Help us maintain a safe and productive exchange workspace. Why are you reporting this user?</p>
</div>
<!-- Form Options List -->
<form class="space-y-3.5" id="report-form">
<!-- Option 1 -->
<label class="flex items-center justify-between w-full bg-white rounded-xl px-5 py-3.5 cursor-pointer border border-[#E2E8F0] hover:border-slate-300 transition-all">
<span class="text-[13.5px] font-semibold text-[#1E293B]">Didn't show up</span>
<input class="w-5 h-5 text-[#0B63E5] border-[#94A3B8] focus:ring-0" name="report_reason" type="radio" value="no_show"/>
</label>
<!-- Option 2 (Selected state) -->
<label class="flex items-center justify-between w-full bg-[#EAF2FD] rounded-xl px-5 py-3.5 cursor-pointer border-[1.5px] border-[#0B63E5] transition-all">
<span class="text-[13.5px] font-bold text-[#0B63E5]">Inappropriate behavior</span>
<!-- Custom selected indicator matching design exactly -->
<div class="relative flex items-center justify-center w-5 h-5 rounded-full border-[2px] border-[#0B63E5] bg-white">
<div class="w-2.5 h-2.5 rounded-full bg-[#0B63E5]"></div>
<input checked="" class="sr-only" name="report_reason" type="radio" value="inappropriate_behavior"/>
</div>
</label>
<!-- Option 3 -->
<label class="flex items-center justify-between w-full bg-white rounded-xl px-5 py-3.5 cursor-pointer border border-[#E2E8F0] hover:border-slate-300 transition-all">
<span class="text-[13.5px] font-semibold text-[#1E293B]">Poor skill competency</span>
<input class="w-5 h-5 text-[#0B63E5] border-[#94A3B8] focus:ring-0" name="report_reason" type="radio" value="poor_competency"/>
</label>
<!-- Option 4 -->
<label class="flex items-center justify-between w-full bg-white rounded-xl px-5 py-3.5 cursor-pointer border border-[#E2E8F0] hover:border-slate-300 transition-all">
<span class="text-[13.5px] font-semibold text-[#1E293B]">Spam or scam attempt</span>
<input class="w-5 h-5 text-[#0B63E5] border-[#94A3B8] focus:ring-0" name="report_reason" type="radio" value="spam_scam"/>
</label>
<!-- Details Card / Text Area Area -->
<div class="pt-3">
<div class="relative w-full h-[210px] bg-white rounded-2xl border border-[#94A3B8] flex items-center justify-center p-6">
<textarea class="w-full h-full border-0 resize-none text-center flex items-center justify-center focus:ring-0 text-[18px] text-[#64748B] placeholder-[#94A3B8] leading-[190px]" data-purpose="report-details-input" placeholder="Details"></textarea>
</div>
</div>
</form>
</div>
<!-- Action Button -->
<div class="pt-10 pb-4">
<button class="w-full py-3.5 px-4 bg-[#FDE2E1] hover:bg-[#FCD3D1] text-[#991B1B] font-bold text-[15px] rounded-2xl transition-colors text-center shadow-sm" form="report-form" type="submit">
          Submit Report
        </button>
</div>
