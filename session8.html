<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Live Session - SkillSwap</title>
<!-- Load Tailwind CSS v3 with forms and container-queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            session: {
              bg: '#0F172A',
              dark: '#0A1120',
              card: '#111827',
              red: '#EF4444',
              hoverRed: '#DC2626'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      background-color: #0b1325;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden text-white flex flex-col justify-between relative p-6 sm:p-8">
<!-- BEGIN: TopBar -->
<header class="w-full flex items-center justify-between z-20">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-slate-800/80 hover:bg-slate-700/80 text-white flex items-center justify-center transition-colors shadow-md backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-slate-400" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Recording Indicator Badge -->
<div class="flex items-center space-x-1.5 px-3 py-1 bg-red-600 hover:bg-red-500 rounded-full shadow-lg transition-colors cursor-default" data-purpose="recording-indicator">
<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
<span class="text-xs font-bold tracking-wider text-white uppercase">REC 45:12</span>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: CenterParticipantArea -->
<main class="flex-1 flex flex-col items-center justify-center -mt-6 z-10">
<!-- Active Speaker Information -->
<div class="flex flex-col items-center text-center">
<!-- Profile Picture Container with Outer Border -->
<div class="relative mb-5">
<div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full ring-4 ring-slate-600/50 shadow-2xl overflow-hidden bg-slate-800">
<img alt="Sama Ali" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-dlkGFkLu_D-li-JmaJF4sFRzPtGaKoGCTY_40Vb83X_CpAIzEfYGOsD5dRVZxtX5dsHQ07Ln--1-b_ZzsZ6Rh88NBATGv8rfLnfBadcHtaU5tGoKTHtCQB4uRjTHbKAwuMi9XwCuinRuLSzN7SVfLtJltSBqp_8X7eD1aS8adTg9kq_Eon28pK2YbnXdq0A9Ty2R6uNxGlEPwj8wCWT4gNX48A7TIwr-tVWE1ilKlMkstPwLzH-i-w">
</div>
</div>
<!-- Speaker Name -->
<h1 class="text-2xl font-bold tracking-tight text-white mb-1">
        Sama Ali
      </h1>
<!-- Teaching Subject Status -->
<p class="text-sm font-medium text-slate-400">
        Teaching Figma
      </p>
<!-- Bottom Audio/Video/Call Action Controls -->
<div class="flex items-center space-x-4 mt-8" data-purpose="call-controls">
<!-- Toggle Microphone Button -->
<button aria-label="Mute or Unmute Microphone" class="w-13 h-13 p-3.5 rounded-full bg-slate-800/90 hover:bg-slate-700 text-white transition-all transform active:scale-95 shadow-lg border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-slate-400" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Toggle Camera Button -->
<button aria-label="Turn Camera On or Off" class="w-13 h-13 p-3.5 rounded-full bg-slate-800/90 hover:bg-slate-700 text-white transition-all transform active:scale-95 shadow-lg border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-slate-400" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Leave / End Call Button -->
<button aria-label="Leave Call" class="w-13 h-13 p-3.5 rounded-full bg-red-500 hover:bg-red-600 text-white transition-all transform active:scale-95 shadow-lg focus:outline-none focus:ring-2 focus:ring-red-400" type="button">
<svg class="w-5 h-5 rotate-[135deg]" fill="currentColor" viewBox="0 0 24 24">
<path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"></path>
</svg>
</button>
</div>
</div>
</main>
<!-- END: CenterParticipantArea -->
<!-- BEGIN: RightFloatingSidebar -->
<aside class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col space-y-4 z-20" data-purpose="floating-participant-tiles">
<!-- Self Video Tile -->
<div class="w-24 h-28 sm:w-28 sm:h-32 rounded-2xl border-2 border-white/90 bg-[#121B2E] overflow-hidden flex flex-col items-center justify-between p-2.5 shadow-2xl cursor-pointer hover:border-white transition-all" data-purpose="self-camera-preview">
<div class="flex-1 flex items-center justify-center mt-1">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-PLOp0Gc-DQkGujwaiEbz4eDgLhcSTS2kVIBjbhcZ51mGvesNJv_rcjQBEc4vUxtwUClpx_RILtmD8RykQsOm7cfc1eGgjiF1b5Ooy-cUFtQ07kgQqjrr9N1uQ0nq-QVFM4ssCdaqy5rBuK1IeloPfF-hZJLfcQKvVl5CzaiXfD_DEsXRbcXuON-oQqMsuEKT_5fzRgZgbUe-k5KYbuc65a1qFhzNZqbqZcBXxzdvmbIrk3jhWlgR2g" alt="Salme (You)" class="w-12 h-12 rounded-full object-cover shadow-sm border border-white/20">
</div>
<span class="text-[11px] font-semibold text-white tracking-wide">
        Salme (You)
      </span>
</div>
<!-- Learning Summary Interactive Bot Card -->
<div class="w-24 h-28 sm:w-28 sm:h-32 rounded-2xl border-2 border-white/90 bg-[#121B2E] overflow-hidden flex flex-col items-center justify-between p-2.5 shadow-2xl cursor-pointer hover:border-white transition-all" data-purpose="learning-summary-tile">
<div class="flex-1 flex items-center justify-center mt-1">
<!-- AI Assistant / Bot Graphic -->
<div class="relative w-12 h-12 flex items-center justify-center">
<svg class="w-10 h-10 drop-shadow-md" fill="none" viewBox="0 0 64 64">
<!-- Antenna -->
<path d="M32 16V8" stroke="#60A5FA" stroke-linecap="round" stroke-width="3"></path>
<circle cx="32" cy="7" fill="#3B82F6" r="3.5"></circle>
<path d="M41 12L46 7" stroke="#FBBF24" stroke-linecap="round" stroke-width="2.5"></path>
<circle cx="47" cy="6" fill="#FBBF24" r="2"></circle>
<!-- Head Shell -->
<rect fill="#FFFFFF" height="28" rx="14" stroke="#3B82F6" stroke-width="2.5" width="34" x="15" y="16"></rect>
<!-- Screen / Face Visor -->
<rect fill="#1E293B" height="18" rx="9" width="24" x="20" y="21"></rect>
<!-- Eyes -->
<ellipse cx="27" cy="29" fill="#38BDF8" rx="2.5" ry="3.5"></ellipse>
<ellipse cx="37" cy="29" fill="#38BDF8" rx="2.5" ry="3.5"></ellipse>
<!-- Cute Blush / Smile -->
<path d="M29 33C30.5 34.5 33.5 34.5 35 33" stroke="#38BDF8" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Left Hand Waving -->
<path d="M14 28C10 24 8 20 11 17C14 14 17 22 17 24" fill="#60A5FA"></path>
<!-- Body base -->
<path d="M24 45C24 43 27 42 32 42C37 42 40 43 40 45V50C40 52 24 52 24 50V45Z" fill="#3B82F6"></path>
</svg>
</div>
</div>
<span class="text-[10px] leading-tight font-semibold text-center text-white">
        Learning Summary
      </span>
</div>
</aside>
<!-- END: RightFloatingSidebar -->






</body></html>
