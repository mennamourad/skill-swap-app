<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Edit Profile - SkillSwap</title>
<!-- Tailwind CSS v3 CDN with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pageBg: '#F4F7FC',
            primaryBlue: '#0057C2',
            mintBg: '#DCF7E9',
            mintText: '#0E7A4A',
            softBlueBg: '#E1EDFF',
            softBlueText: '#185BCE',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      background-color: #F4F7FC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-[#F4F7FC] min-h-screen text-slate-800 antialiased flex flex-col justify-between p-6 sm:p-10 md:p-12">
<!-- BEGIN: MainContentContainer -->
<main class="w-full max-w-[1360px] mx-auto flex-grow flex flex-col justify-between" data-purpose="edit-profile-wrapper">
<!-- Top Segment: Header and Form Fields -->
<div class="w-full space-y-7">
<!-- BEGIN: TopBar -->
<header class="flex items-center justify-between pt-1 pb-2" data-purpose="navigation-header">
<h1 class="text-[26px] font-extrabold text-[#111827] tracking-tight">Edit Profile</h1>
<button class="text-[#0057C2] text-lg font-semibold hover:underline cursor-pointer focus:outline-none" data-purpose="done-button" type="button">
          Done
        </button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: AvatarSection -->
<section class="flex flex-col items-center justify-center pt-1 pb-4" data-purpose="profile-avatar-container">
<!-- Profile Picture Container -->
<div class="relative w-28 h-28 rounded-full overflow-hidden bg-white shadow-sm border border-slate-100 flex items-center justify-center mb-3">
<img alt="Profile Avatar" class="w-full h-full object-cover object-top" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBze7R7_qxpnoUAA2KGKSH5C74Gi402oYEJ65h-VCro_mE5LoDzMS_EY6n67a99-pCb__95YyPj3lM3bmjYDVYfqth3e0xwQnx5QzCA0hkUmDvzumYM6LK_Q3cjvi4-qXkW3FvnZTSvPetZkYR3BGONZy_U7WYJpM3LJrUQC5UuZ5bftdxq-G8u9T-f5y-MfVQBbh0yRD0oDZKXhg0TnFJ3Cog5KRYm4ya71f2r6I9S6TvrXHiHOAHyDQ">
</div>
<!-- Action to change photo -->
<button class="text-[#0057C2] font-semibold text-[15px] hover:underline cursor-pointer focus:outline-none" data-purpose="change-photo-action" type="button">
          Change Profile Photo
        </button>
</section>
<!-- END: AvatarSection -->
<!-- BEGIN: FormFields -->
<form class="space-y-6" data-purpose="profile-edit-form" onsubmit="event.preventDefault();">
<!-- Input: Full Name -->
<div class="space-y-2">
<label class="block text-[13px] font-bold tracking-wider text-slate-500 uppercase" for="fullName">
            FULL NAME
          </label>
<input class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl text-slate-800 text-base focus:ring-2 focus:ring-[#0057C2] focus:border-transparent outline-none transition duration-150 shadow-sm" id="fullName" name="fullName" type="text" value="Dina Akram">
</div>
<!-- Input: Year & Department -->
<div class="space-y-2">
<label class="block text-[13px] font-bold tracking-wider text-slate-500 uppercase" for="yearDepartment">
            YEAR &amp; DEPARTMENT
          </label>
<input class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl text-slate-800 text-base focus:ring-2 focus:ring-[#0057C2] focus:border-transparent outline-none transition duration-150 shadow-sm" id="yearDepartment" name="yearDepartment" type="text" value="Programmer">
</div>
<!-- Skills I Can Teach Section -->
<div class="pt-1 space-y-2.5">
<label class="block text-[15px] font-bold text-slate-700">
            Skills I can teach
          </label>
<div class="flex items-center space-x-3">
<!-- Skill Pill: Python -->
<div class="inline-flex items-center space-x-2 bg-[#DCF7E9] text-[#0E7A4A] px-4 py-1.5 rounded-full text-sm font-semibold select-none shadow-xs">
<span>Python</span>
<button aria-label="Remove Python" class="text-xs font-bold leading-none hover:text-emerald-900 transition-colors ml-0.5" type="button">✕</button>
</div>
<!-- Add Skill Button -->
<button aria-label="Add Skill to Teach" class="text-[#0E7A4A] hover:opacity-80 transition p-1 font-bold text-2xl leading-none flex items-center justify-center" type="button">
<svg class="h-6 w-6 stroke-[2.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Skills I Want to Learn Section -->
<div class="pt-1 space-y-2.5">
<label class="block text-[15px] font-bold text-slate-700">
            Skills I want to learn
          </label>
<div class="flex items-center space-x-3">
<!-- Skill Pill: Guitar -->
<div class="inline-flex items-center space-x-2 bg-[#E1EDFF] text-[#185BCE] px-4 py-1.5 rounded-full text-sm font-semibold select-none shadow-xs">
<span>Guitar</span>
<button aria-label="Remove Guitar" class="text-xs font-bold leading-none hover:text-blue-900 transition-colors ml-0.5" type="button">✕</button>
</div>
<!-- Add Skill Button -->
<button aria-label="Add Skill to Learn" class="text-[#0057C2] hover:opacity-80 transition p-1 font-bold text-2xl leading-none flex items-center justify-center" type="button">
<svg class="h-6 w-6 stroke-[2.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</form>
<!-- END: FormFields -->
</div>
<!-- BEGIN: BottomActions -->
<div class="w-full pt-16 pb-4" data-purpose="save-button-container">
<button class="w-full bg-[#0057C2] hover:bg-[#004bb0] active:bg-[#004199] text-white font-semibold text-lg py-4 rounded-full shadow-sm transition-colors duration-200 flex items-center justify-center cursor-pointer" data-purpose="save-changes-button" type="button">
        Save Changes
      </button>
</div>
<!-- END: BottomActions -->
</main>
<!-- END: MainContentContainer -->


</body></html>
