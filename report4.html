<!-- BEGIN: MainContentArea -->
<main class="flex-1 flex flex-col min-w-0" data-purpose="report-form-container">
<div class="p-8 max-w-[1150px] w-full mx-auto">
<!-- Top Bar: Back & Heading -->
<div class="flex items-center gap-3 mb-8">
<button aria-label="Go Back" class="text-[#0F172A] hover:text-slate-600 transition-colors -ml-1" type="button">
<svg class="w-[20px] h-[20px] stroke-[2.4]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h2 class="text-[20px] font-bold text-[#0F172A]">Report User</h2>
</div>
<!-- Report Description Section -->
<div class="mb-6">
<h3 class="text-[17px] font-bold text-[#0F172A] mb-1">Report Alaa Ahmed</h3>
<p class="text-[13px] text-[#64748B]">Help us maintain a safe and productive exchange workspace. Why are you reporting this user?</p>
</div>
<!-- Options Stack -->
<form action="#" class="space-y-3.5" method="POST">
<!-- Option 1: Didn't show up -->
<label class="flex items-center justify-between w-full px-5 py-3.5 bg-white rounded-2xl border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] cursor-pointer hover:border-slate-200 transition-all">
<span class="text-[13.5px] font-medium text-[#1E293B]">Didn't show up</span>
<span class="w-[18px] h-[18px] rounded-full border-2 border-[#94A3B8] inline-block shrink-0"></span>
</label>
<!-- Option 2: Inappropriate behavior (Active/Selected) -->
<label class="flex items-center justify-between w-full px-5 py-3.5 bg-[#EBF2FE] rounded-2xl border-2 border-[#2563EB] shadow-sm cursor-pointer">
<span class="text-[13.5px] font-medium text-[#2563EB]">Inappropriate behavior</span>
<span class="w-[18px] h-[18px] rounded-full border-2 border-[#2563EB] flex items-center justify-center shrink-0 bg-white">
<span class="w-[8px] h-[8px] rounded-full bg-[#2563EB]"></span>
</span>
</label>
<!-- Option 3: Poor skill competency -->
<label class="flex items-center justify-between w-full px-5 py-3.5 bg-white rounded-2xl border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] cursor-pointer hover:border-slate-200 transition-all">
<span class="text-[13.5px] font-medium text-[#1E293B]">Poor skill competency</span>
<span class="w-[18px] h-[18px] rounded-full border-2 border-[#94A3B8] inline-block shrink-0"></span>
</label>
<!-- Option 4: Spam or scam attempt -->
<label class="flex items-center justify-between w-full px-5 py-3.5 bg-white rounded-2xl border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] cursor-pointer hover:border-slate-200 transition-all">
<span class="text-[13.5px] font-medium text-[#1E293B]">Spam or scam attempt</span>
<span class="w-[18px] h-[18px] rounded-full border-2 border-[#94A3B8] inline-block shrink-0"></span>
</label>
<!-- Details Input Container -->
<div class="pt-5 pb-2">
<div class="w-full bg-white rounded-2xl border border-[#94A3B8]/60 min-h-[220px] flex items-center justify-center">
<span class="text-[17px] font-normal text-[#64748B]/90 select-none">Details</span>
</div>
</div>
<!-- Submit Button -->
<div class="pt-36">
<button class="w-full bg-[#FEE2E2] hover:bg-[#FECACA] active:bg-[#FCA5A5] text-[#991B1B] text-[15px] font-semibold py-3.5 px-6 rounded-full transition-colors text-center shadow-sm" type="submit">
            Submit Report
          </button>
</div>
</form>
</div>
