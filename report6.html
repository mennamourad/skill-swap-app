<!-- Chat -->

<!-- Session -->
<a class="flex items-center gap-3.5 px-3 py-2.5 rounded-lg text-sm font-medium text-[#475569] hover:text-[#1e293b] hover:bg-slate-50 transition-colors" href="#">

<!-- Points Wallet -->
<a class="flex items-center gap-3.5 px-3 py-2.5 rounded-lg text-sm font-medium text-[#475569] hover:text-[#1e293b] hover:bg-slate-50 transition-colors" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">

</svg>
<span>Points Wallet</span>
</a>
<!-- Coins Wallet -->
<a class="flex items-center gap-3.5 px-3 py-2.5 rounded-lg text-sm font-medium text-[#475569] hover:text-[#1e293b] hover:bg-slate-50 transition-colors" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Coins Wallet</span>

<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">

</svg>
<span>Notifications</span>

<!-- Profile -->
<a class="flex items-center gap-3.5 px-3 py-2.5 rounded-lg text-sm font-medium text-[#475569] hover:text-[#1e293b] hover:bg-slate-50 transition-colors" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">

<span>Profile</span>
</a>

</div>
</div>
</div>
<!-- Sidebar Bottom: Settings & Logout -->
<div>
<span class="text-[11px] font-bold tracking-wider text-[#64748b] uppercase block mb-3">SETTINGS</span>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-[#ef4444] hover:bg-red-50 transition-colors" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">

</svg>
<span>Logout</span>
</a>
</div>
</aside>

<!-- BEGIN: MainContent -->
<main class="flex-1 bg-[#f4f7fb] flex flex-col justify-between p-8 sm:p-12 overflow-y-auto">
<div class="max-w-4xl w-full mx-auto space-y-6">
<!-- Top Section: Back and Header -->
<section data-purpose="header-section">
<div class="flex items-center gap-3 mb-6">
<button aria-label="Go back" class="text-slate-800 hover:text-slate-600 transition-colors" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-lg font-bold text-slate-900 tracking-tight">Report User</h1>
</div>
<div class="space-y-1">
<h2 class="text-[19px] font-bold text-[#0f172a]">Report Amira Ahmed</h2>
<p class="text-[14px] text-[#64748b]">Help us maintain a safe and productive exchange workspace. Why are you reporting this user?</p>
</div>
</section>
<!-- Selection List of Reasons -->
<section class="space-y-3 pt-2" data-purpose="report-reasons">
<!-- Option 1: Didn't show up -->
<label class="flex items-center justify-between px-5 py-3.5 bg-white border border-[#cbd5e1] rounded-2xl cursor-pointer hover:border-slate-400 transition-all select-none shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
<span class="text-sm font-semibold text-[#1e293b]">Didn't show up</span>
<div class="relative flex items-center justify-center">
<input class="sr-only peer" name="report_reason" type="radio" value="no-show"/>
<div class="w-5 h-5 rounded-full border-2 border-[#94a3b8] peer-checked:border-[#2563eb] peer-checked:border-[6px] bg-white transition-all"></div>
</div>
</label>
<!-- Option 2: Inappropriate behavior (Selected) -->
<label class="flex items-center justify-between px-5 py-3.5 bg-[#e0ecfc] border-2 border-[#2563eb] rounded-2xl cursor-pointer transition-all select-none shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
<span class="text-sm font-semibold text-[#0f172a]">Inappropriate behavior</span>
<div class="relative flex items-center justify-center">
<input checked="" class="sr-only peer" name="report_reason" type="radio" value="inappropriate-behavior"/>
<!-- Active Radio Visual State -->
<div class="w-5 h-5 rounded-full border-2 border-[#1d4ed8] flex items-center justify-center bg-white">
<div class="w-2.5 h-2.5 rounded-full bg-[#1d4ed8]"></div>
</div>
</div>
</label>
<!-- Option 3: Poor skill competency -->
<label class="flex items-center justify-between px-5 py-3.5 bg-white border border-[#cbd5e1] rounded-2xl cursor-pointer hover:border-slate-400 transition-all select-none shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
<span class="text-sm font-semibold text-[#1e293b]">Poor skill competency</span>
<div class="relative flex items-center justify-center">
<input class="sr-only peer" name="report_reason" type="radio" value="poor-competency"/>
<div class="w-5 h-5 rounded-full border-2 border-[#94a3b8] peer-checked:border-[#2563eb] peer-checked:border-[6px] bg-white transition-all"></div>
</div>
</label>
<!-- Option 4: Spam or scam attempt -->
<label class="flex items-center justify-between px-5 py-3.5 bg-white border border-[#cbd5e1] rounded-2xl cursor-pointer hover:border-slate-400 transition-all select-none shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
<span class="text-sm font-semibold text-[#1e293b]">Spam or scam attempt</span>
<div class="relative flex items-center justify-center">
<input class="sr-only peer" name="report_reason" type="radio" value="spam-or-scam"/>
<div class="w-5 h-5 rounded-full border-2 border-[#94a3b8] peer-checked:border-[#2563eb] peer-checked:border-[6px] bg-white transition-all"></div>
</div>
</label>
</section>
<!-- Details Text Input Box -->
<section class="pt-3" data-purpose="details-container">
<div class="relative w-full h-[230px] rounded-2xl border-2 border-[#94a3b8] bg-transparent flex items-center justify-center">
<textarea class="w-full h-full p-4 resize-none bg-transparent border-none focus:ring-0 text-center placeholder-[#64748b] text-[17px] font-normal leading-relaxed text-slate-800 placeholder:text-slate-500 placeholder:text-lg focus:outline-none flex items-center justify-center" id="report_details" name="report_details" placeholder="Details"></textarea>
</div>
</section>
</div>
<!-- Bottom Submit Button Container -->
<footer class="max-w-4xl w-full mx-auto pt-8" data-purpose="form-actions">
<button class="w-full py-3.5 px-6 rounded-full bg-[#fce4e4] hover:bg-[#fad5d5] active:bg-[#f8c4c4] text-[#991b1b] font-semibold text-[15px] transition-colors focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2" type="button">
        Submit Report
      </button>
</footer>
</main>
<!-- END: MainContent -->
</body></html>
