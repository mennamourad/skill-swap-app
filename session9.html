<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Live Video Session - Teaching Network</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            session: {
              bg: '#0c1322',
              card: 'rgba(255, 255, 255, 0.05)',
              cardBorder: 'rgba(255, 255, 255, 0.2)',
              btnDark: '#1e293b',
              btnDarkHover: '#334155',
              recRed: '#ef4444',
            }
          }
        }
      }
    }
  </script>
<!-- Custom CSS for specific styling -->
<style data-purpose="custom-layout">
    body {
      background-color: #0c1322;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="h-full w-full select-none overflow-hidden bg-[#0c1322] flex flex-col justify-between relative">
<!-- BEGIN: TopBar -->
<header class="w-full flex items-center justify-between px-6 py-5 z-20" data-purpose="top-navigation">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-slate-800/80 hover:bg-slate-700 text-white flex items-center justify-center transition-all duration-200 focus:outline-none" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Recording Indicator Badge -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 bg-[#ef4444] text-white rounded-full text-xs font-semibold tracking-wide shadow-sm" data-purpose="recording-indicator">
<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
<span>REC 45:12</span>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col items-center justify-center -mt-6 z-10 px-4" data-purpose="call-center-stage">
<!-- Instructor Avatar -->
<div class="relative mb-5" data-purpose="instructor-profile">
<div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full p-1 ring-2 ring-white/20 bg-slate-800 shadow-2xl flex items-center justify-center overflow-hidden">
<img alt="Alaa Ahmed - Instructor" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXAD461faRA-yXoYfrfhY1v2U8rdjSdmgUmDRMQ23n1hLe4F9FCYlthjmHSlfPhmeMGmozNZ-EORhmFUNHjnYHjKNBD8IxXAb24MpzXsWPf0kD7JahR4XPVsNDdt4gzFb7NI-zA3FQrECX7Qst1KB7-QWlpqMf_XU-u7zOPmefSGCLgK2Zik0jRTRICRCPr6fntN4zbhGYY6Trs1jOKiC2B-uy6nPAZwrch5QFJoVnoV6BDr0eR4lrfw">

<div class="text-center mb-8" data-purpose="instructor-details">
<h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white mb-1">Alaa Ahmed</h1>
<p class="text-xs sm:text-sm text-slate-400 font-medium tracking-wide">Teaching Network</p>
</div>
<!-- Floating Action Controls -->
<div class="flex items-center gap-4 sm:gap-5" data-purpose="session-controls">
<!-- Microphone Button -->
<button aria-label="Toggle Microphone" class="w-13 h-13 p-3.5 rounded-full bg-[#1e293b]/90 hover:bg-[#334155] text-white flex items-center justify-center transition-colors focus:outline-none shadow-lg border border-slate-700/50" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Camera Button -->
<button aria-label="Toggle Camera" class="w-13 h-13 p-3.5 rounded-full bg-[#1e293b]/90 hover:bg-[#334155] text-white flex items-center justify-center transition-colors focus:outline-none shadow-lg border border-slate-700/50" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- End Call Button -->

<svg class="w-5 h-5 transform rotate-[135deg]" fill="currentColor" viewBox="0 0 24 24">
<path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"></path>
