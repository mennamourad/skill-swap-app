<main class="flex-1 flex flex-col px-10 py-8 overflow-y-auto" data-purpose="report-form-container">
<div class="max-w-[1040px] w-full mx-auto flex flex-col justify-between flex-1">
<div>
<!-- Top Navigation / Back Title -->
<header class="flex items-center gap-3.5 mb-8" data-purpose="page-header">
<button aria-label="Go back" class="text-slate-800 hover:text-slate-600 focus:outline-none" type="button">

<h2 class="text-[17px] font-bold text-slate-900 tracking-tight">Report User</h2>
</header>
<!-- Section Title & Description -->
<section class="mb-6" data-purpose="report-intro">
<h3 class="text-lg font-bold text-slate-900 mb-1">Report Sana Amer</h3>
<p class="text-[13px] text-slate-500">Help us maintain a safe and productive exchange workspace. Why are you reporting this user?</p>
</section>
<!-- Reason Selection Radio Group -->
<fieldset class="space-y-3 mb-6" data-purpose="report-options">
<legend class="sr-only">Select reason for reporting</legend>
<!-- Option 1: Didn't show up -->
<label class="flex items-center justify-between px-5 py-3.5 bg-white border border-slate-200/80 rounded-xl cursor-pointer hover:border-slate-300 transition-all">
<span class="text-[13px] font-semibold text-slate-800">Didn't show up</span>
<input class="sr-only peer" name="report_reason" type="radio" value="no_show"/>
<!-- Custom Radio Circle Unchecked -->
<div class="w-5 h-5 rounded-full border-2 border-slate-400 peer-checked:border-[#0252CC] peer-checked:border-[6px] transition-all shrink-0"></div>
</label>
<!-- Option 2: Inappropriate behavior (Active/Selected) -->
<label class="flex items-center justify-between px-5 py-3.5 bg-[#EBF3FF] border border-[#0252CC] rounded-xl cursor-pointer transition-all">
<span class="text-[13px] font-semibold text-[#0252CC]">Inappropriate behavior</span>
<input checked="" class="sr-only peer" name="report_reason" type="radio" value="inappropriate_behavior"/>
<!-- Custom Radio Circle Checked -->
<div class="w-5 h-5 rounded-full border-[5px] border-[#0252CC] bg-[#0252CC] flex items-center justify-center shrink-0">
<div class="w-1.5 h-1.5 bg-white rounded-full"></div>
</div>
</label>
<!-- Option 3: Poor skill competency -->
<label class="flex items-center justify-between px-5 py-3.5 bg-white border border-slate-200/80 rounded-xl cursor-pointer hover:border-slate-300 transition-all">
<span class="text-[13px] font-semibold text-slate-800">Poor skill competency</span>
<input class="sr-only peer" name="report_reason" type="radio" value="poor_competency"/>
<div class="w-5 h-5 rounded-full border-2 border-slate-400 shrink-0"></div>
</label>
<!-- Option 4: Spam or scam attempt -->
<label class="flex items-center justify-between px-5 py-3.5 bg-white border border-slate-200/80 rounded-xl cursor-pointer hover:border-slate-300 transition-all">
<span class="text-[13px] font-semibold text-slate-800">Spam or scam attempt</span>
<input class="sr-only peer" name="report_reason" type="radio" value="spam_scam"/>
<div class="w-5 h-5 rounded-full border-2 border-slate-400 shrink-0"></div>
</label>
</fieldset>
<!-- Details Textarea Container -->
<section class="mb-10" data-purpose="details-box">
<label class="sr-only" for="report-details">Details</label>
<div class="relative w-full h-52 bg-white border border-slate-200/90 rounded-2xl flex items-center justify-center p-4">
<textarea class="w-full h-full text-center border-0 focus:ring-0 resize-none text-[17px] text-slate-500 placeholder-slate-400 focus:placeholder-transparent flex items-center justify-center pt-20" id="report-details" name="report_details" placeholder="Details" rows="6"></textarea>
</div>
</section>
</div>
<!-- Submit Action Button -->
<footer class="pt-4 pb-2" data-purpose="form-actions">
<button class="w-full py-3.5 px-6 rounded-2xl bg-[#FEE2E2] hover:bg-[#FCD2D2] text-[#991B1B] font-bold text-sm text-center transition-colors focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-1" type="button">
          Submit Report
        </button>
</footer>
