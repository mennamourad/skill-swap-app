<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Live Video Session - SkillSwap</title>
<!-- Load Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            callDark: '#0d1527',
            tileBg: '#131d2e',
            btnBg: '#1e293b',
            endCall: '#e02e3b'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-layout">
    /* Custom scrollbar and base viewport styling */
    body {
      background-color: #0d1527;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="h-full w-full m-0 p-0 text-white font-sans flex flex-col justify-between relative bg-[#0d1527]">
<!-- BEGIN: TopNavigation -->
<!-- Header bar with back button and recording status indicator -->
<header class="w-full flex items-center justify-between p-6 md:p-8 z-20">
<!-- Back to previous page / dashboard button -->
<button aria-label="Back to dashboard" class="w-10 h-10 rounded-full bg-[#1b263b] hover:bg-[#25334d] flex items-center justify-center transition-colors text-white shadow-md focus:outline-none focus:ring-2 focus:ring-white/20" data-purpose="back-navigation-button" type="button">
<svg class="w-5 h-5 text-gray-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Call Recording Status Badge -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#e02e3b] text-white text-xs font-semibold tracking-wide shadow-lg" data-purpose="recording-indicator">
<span>REC 45:12</span>
</div>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: MainContent -->
<!-- Centered participant information and control actions -->
<main class="flex-1 flex flex-col items-center justify-center -mt-10 px-4 z-10">
<div class="flex flex-col items-center text-center">
<!-- Primary Active Speaker Profile Image -->
<div class="w-28 h-28 md:w-32 md:h-32 rounded-full overflow-hidden p-0.5 bg-gradient-to-b from-gray-600 to-transparent shadow-2xl mb-4" data-purpose="primary-speaker-avatar">
<img alt="Sana Amer" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI7H4hKm_qsJPZ-xoUv4hmjHsRGw2T6LKvG5Oljaa21SahxlDEmhURhJgp1w23t6cyOYCQ-Rh_owqvQN1QHy4bbKKijfi5Bab3sdRQXq8usdVsyCaFXr9WlOPROF145q-uYBigKZY9K178NVlsQ05f5RUWIAkxzj1fAC1Nqq3D0FEKmowFkMgRxkg7Bf1VUWfAGC7-pJ3ItMucFV2pNSFanOpIPj3kE9usFJ6PPBJg9mCbt7Wk-owAgg">
</div>
<!-- Speaker Name and Current Activity -->
<h1 class="text-xl md:text-2xl font-bold tracking-tight text-white mb-1">
        Sana Amer
      </h1>
<p class="text-xs md:text-sm text-slate-400 font-normal mb-8">
        Teaching Python Programming
      </p>
<!-- Bottom Audio/Video/End Call Controls -->
<div class="flex items-center space-x-4 md:space-x-5" data-purpose="call-controls-bar">
<!-- Toggle Microphone Button -->
<button aria-label="Toggle microphone" class="w-12 h-12 rounded-full bg-[#1e2a3c] hover:bg-[#28374d] text-white flex items-center justify-center transition-all shadow-md focus:outline-none focus:ring-2 focus:ring-white/20" data-purpose="mute-mic-btn" type="button">
<svg class="w-5 h-5 text-gray-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Toggle Video Button (Currently Disabled/Muted icon state) -->
<button aria-label="Toggle camera" class="w-12 h-12 rounded-full bg-[#1e2a3c] hover:bg-[#28374d] text-white flex items-center justify-center transition-all shadow-md focus:outline-none focus:ring-2 focus:ring-white/20" data-purpose="disable-camera-btn" type="button">
<svg class="w-5 h-5 text-gray-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M3 3l18 18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- End Call Button -->
<button aria-label="End call" class="w-12 h-12 rounded-full bg-[#e02e3b] hover:bg-[#c92430] text-white flex items-center justify-center transition-all shadow-lg focus:outline-none focus:ring-2 focus:ring-red-400" data-purpose="end-call-btn" type="button">
<svg class="w-5 h-5 text-white transform rotate-[135deg]" fill="currentColor" viewBox="0 0 24 24">
<path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.21 2.2z"></path>
</svg>
</button>
</div>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: RightFloatingSidebar -->
<!-- Sidebar video feeds and automated AI assistant cards -->
<aside class="absolute right-6 md:right-8 top-1/2 -translate-y-1/2 flex flex-col space-y-4 z-20" data-purpose="call-side-tiles">
<!-- User's own preview thumbnail tile -->
<div class="w-20 h-28 md:w-24 md:h-32 bg-[#121c2c] border border-white/90 rounded-xl flex flex-col items-center justify-center p-2 shadow-xl hover:border-white transition-all cursor-pointer" data-purpose="user-pip-tile">
<div class="w-10 h-10 md:w-11 md:h-11 rounded-full overflow-hidden mb-2 ring-1 ring-white/30">
<img alt="Salme" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGrNiS-VyHCD5sGkoJSrKjsO0a9el6D8edU68Izrnh7h50u2RYqbbTuf83f5jSWGhv5A-I0jCYVHNcHwQDQpv0tdCMNYfPrFS4Invl_8S89w2lj-bOBLX_O95m4C1jJmQccy9yIsX_tAkqSYH9pCc6PZyyOhD_XtbNOnkI07Lrf6jcNYAIRboz5NQ0pakj49MoaV8dzH5AhK4qHqCLLCX55yigLEkoyfWg-qUaBVWMO8XMPDaziJR60w">
</div>
<span class="text-[11px] font-medium text-white tracking-tight text-center">Salme (You)</span>
</div>
<!-- AI Learning Summary Assistant thumbnail tile -->
<div class="w-20 h-28 md:w-24 md:h-32 bg-[#121c2c] border border-white/90 rounded-xl flex flex-col items-center justify-center p-2 shadow-xl hover:border-white transition-all cursor-pointer" data-purpose="ai-summary-tile">
<!-- Stylized robot mascot avatar -->
<div class="w-10 h-10 md:w-11 md:h-11 flex items-center justify-center mb-1">
<div class="relative w-9 h-9 bg-gradient-to-tr from-blue-600 to-indigo-400 rounded-full flex items-center justify-center shadow-inner">
<!-- Robot Face Display -->
<div class="w-7 h-5 bg-[#0b1329] rounded-md flex items-center justify-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-cyan-300 animate-pulse"></span>
<span class="w-1.5 h-1.5 rounded-full bg-cyan-300 animate-pulse"></span>
</div>
<!-- Waving Antenna & Arm accent -->
<div class="absolute -top-1 w-1.5 h-1.5 bg-yellow-400 rounded-full ring-1 ring-white/50"></div>
<span class="absolute -right-1 top-0 text-[10px]">👋</span>
</div>
</div>
<span class="text-[10px] md:text-[11px] font-medium text-white tracking-tight text-center leading-tight">
        Learning Summary
      </span>
</div>
</aside>
<!-- END: RightFloatingSidebar -->




</body></html>
