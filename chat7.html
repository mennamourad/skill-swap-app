<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SkillSwap - Chat</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052CC',
              darkBlue: '#004fc4',
              bgLight: '#F3F6FB',
              textGray: '#4A5568',
              activeBlue: '#0052CC',
            }
          }
        }
      }
    }
  </script>
<!-- Custom Style Tag for Global Font and Specific Rules -->
<style data-purpose="typography-and-base">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" data-snapdom="injected-import"></head>
<body class="bg-white text-gray-800 antialiased h-screen overflow-hidden">
<!-- BEGIN: MainContainer -->
<div class="flex h-full w-full" data-purpose="main-layout-container">
<!-- BEGIN: LeftSidebar -->
<aside class="w-60 flex-shrink-0 bg-white border-r border-gray-100 flex flex-col justify-between py-7 px-6 select-none" data-purpose="sidebar-navigation">
<!-- Top Section: Brand & Nav Links -->
<div class="flex flex-col">
<!-- Logo -->
<div class="mb-10 px-2" data-purpose="brand-logo">
<span class="text-xl font-black tracking-wider text-brand-blue uppercase">SKILLSWAP</span>
</div>
<!-- Section: Overview -->
<div class="mb-3 px-2">
<span class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">OVERVIEW</span>
</div>
<!-- Navigation Items -->
<nav class="space-y-1" data-purpose="overview-menu">
<!-- Home (Active Item) -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-brand-blue rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Home</span>
</a>
<!-- Search -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Search</span>
</a>
<!-- Swap -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.03 8.03 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Swap</span>
</a>
<!-- Chat -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Chat</span>
</a>
<!-- Session -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Session</span>
</a>
<!-- Points Wallet -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Points Wallet</span>
</a>
<!-- Coins Wallet -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Coins Wallet</span>
</a>
<!-- Notifications -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Notifications</span>
</a>
<!-- Profile -->
<a class="flex items-center gap-3.5 px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg transition-colors" href="#">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Profile</span>
</a>
</nav>
</div>
<!-- Bottom Section: Settings & Logout -->
<div class="px-2" data-purpose="sidebar-settings">
<span class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3">SETTINGS</span>
<button class="flex items-center gap-3 text-sm font-medium text-red-500 hover:text-red-600 transition-colors" type="button">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Logout</span>
</button>
</div>
</aside>
<!-- END: LeftSidebar -->
<!-- BEGIN: MainChatArea -->
<main class="flex-1 flex flex-col h-full bg-brand-bgLight overflow-hidden" data-purpose="chat-main-section">
<!-- Chat Header -->
<header class="h-14 bg-brand-blue flex items-center px-6 text-white shadow-sm flex-shrink-0 z-10" data-purpose="chat-header">
<div class="flex items-center gap-4">
<!-- Back button -->
<button aria-label="Go back" class="text-white hover:opacity-80 transition-opacity" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Avatar -->
<div class="relative w-8 h-8 rounded-full overflow-hidden bg-white/20 flex-shrink-0 border border-white/30">
<img alt="Nada Mohammed" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1DV8en9wLbwK40sM-FFnh2S5CL-DsmVoP-zMgiiPGPg-5eGzPJQjQX3L8-TLLMO2CtxHoTQDvp4ztNpvm9tw4ACEkBWBSzFd5hUhlRSVMJweKRqyZrTNj03hPZblHVp5roKdiwNXRZPNTKLz07KQJFiU8mLoTeJ7YtP8kRCm3JqyohNu72uxYaqoeZ__-rZpuEIO3jJRGZVgEwmv8hRxNNAMofOL-B7Q4MP-ymIg79QAwZsO3VHNHHA">
</div>
<!-- User Name -->
<h1 class="text-base font-bold text-white tracking-wide">Nada Mohammed</h1>
</div>
</header>
<!-- Chat Messages Container -->
<section class="flex-1 overflow-y-auto px-8 py-6 flex flex-col justify-between" data-purpose="chat-conversation-area">
<!-- Messages Flow -->
<div class="space-y-5 flex flex-col">
<!-- Incoming Message 1 -->
<div class="flex justify-start" data-purpose="incoming-message">
<div class="bg-white text-gray-800 text-sm font-normal px-5 py-3 rounded-2xl shadow-sm max-w-md border border-gray-100">
              Hi! Can you teach UI/UX?
            </div>
</div>
<!-- Outgoing Message 1 -->
<div class="flex justify-end" data-purpose="outgoing-message">
<div class="bg-brand-blue text-white text-sm font-normal px-5 py-3 rounded-2xl shadow-sm max-w-md">
              Sure! Sat 4pm? Swap for Python help?
            </div>
</div>
<!-- Incoming Message 2 -->
<div class="flex justify-start" data-purpose="incoming-message">
<div class="bg-white text-gray-800 text-sm font-normal px-5 py-3 rounded-2xl border border-gray-100 shadow-sm max-w-md">
              Deal! Swapped.
            </div>
</div>
</div>
<!-- Chat Input Bar -->
<div class="w-full pt-6 pb-2" data-purpose="chat-input-container">
<form class="relative flex items-center w-full" onsubmit="event.preventDefault()">
<!-- Text Input -->
<input class="w-full bg-white border border-transparent rounded-full py-3.5 pl-6 pr-14 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-brand-blue shadow-sm" data-purpose="message-input-field" placeholder="Type a message" type="text">
<!-- Send Button -->
<button aria-label="Send message" class="absolute right-2.5 w-9 h-9 bg-brand-blue hover:bg-brand-darkBlue text-white rounded-full flex items-center justify-center transition-colors shadow-sm focus:outline-none" data-purpose="send-message-button" type="submit">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</form>
</div>
</section>
</main>
<!-- END: MainChatArea -->
</div>
<!-- END: MainContainer -->


</body></html>
